name: CI

# Builds, tests and packs the plugin on every pull request and on main. macOS, because the plugin
# declares only macOS entrypoints and the stub host has to start the real artifact.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    name: Build, test and pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build YouTubeAdSkipper.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test YouTubeAdSkipper.slnx -c Release --no-build

      - name: Install the plugin CLI
        run: |
          set -euo pipefail
          dotnet tool install --global MacroDeck.Plugin.Cli --prerelease
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Conformance suite
        run: macrodeck-plugin test --project src/YouTubeAdSkipper --report markdown --output conformance.md

      - name: Build and pack the plugin
        run: |
          set -euo pipefail
          macrodeck-plugin build --source src/YouTubeAdSkipper --output "${{ runner.temp }}/plugin-artifacts" --force
          artifact=$(find "${{ runner.temp }}/plugin-artifacts" -name '*.macroDeckPlugin' -print -quit)
          if [ -z "$artifact" ]; then
            echo "::error::macrodeck-plugin build produced no artifact."
            exit 1
          fi
          macrodeck-plugin validate --artifact "$artifact"
          macrodeck-plugin inspect --artifact "$artifact"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            ${{ runner.temp }}/plugin-artifacts/*.macroDeckPlugin
            conformance.md
          retention-days: 14
          if-no-files-found: error
